<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Noven.code CRM — Административная платформа</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="stylesheet" href="/css/styles.css" />
  <style>
    body {
      background: var(--near-black);
      color: var(--off-white);
    }
    .crm-layout {
      display: grid;
      grid-template-columns: 270px 1fr;
      min-height: 100vh;
    }
    .crm-sidebar {
      background: #120E11;
      border-right: 1px solid var(--border-dark);
      padding: 1.75rem 1.25rem;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: sticky;
      top: 0;
      height: 100vh;
      overflow-y: auto;
    }
    .crm-nav-btn {
      width: 100%;
      text-align: left;
      padding: 0.75rem 1rem;
      border-radius: 10px;
      font-family: var(--font-display);
      font-size: 0.85rem;
      font-weight: 600;
      color: rgba(248, 247, 245, 0.7);
      display: flex;
      align-items: center;
      justify-content: space-between;
      transition: all 0.2s ease;
      margin-bottom: 0.25rem;
    }
    .crm-nav-btn:hover {
      background: rgba(255, 255, 255, 0.05);
      color: var(--white);
    }
    .crm-nav-btn.active {
      background: var(--burgundy);
      color: var(--white);
      border: 1px solid var(--crimson);
    }
    .crm-main {
      padding: 2rem 2.5rem;
      overflow-x: hidden;
    }
    .crm-topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 1rem;
      padding-bottom: 1.5rem;
      margin-bottom: 2rem;
      border-bottom: 1px solid var(--border-dark);
    }
    .crm-stat-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(195px, 1fr));
      gap: 1.15rem;
      margin-bottom: 2rem;
    }
    .crm-stat-card {
      background: #1F191E;
      border: 1px solid var(--border-dark);
      border-radius: 14px;
      padding: 1.35rem 1.5rem;
    }
    .crm-stat-val {
      font-family: var(--font-display);
      font-size: 2.35rem;
      font-weight: 800;
      color: var(--white);
      line-height: 1.1;
      margin-top: 0.4rem;
    }
    .crm-panel {
      background: #1E181D;
      border: 1px solid var(--border-dark);
      border-radius: 14px;
      padding: 1.5rem;
      margin-bottom: 1.5rem;
    }
    .crm-table-wrap {
      width: 100%;
      overflow-x: auto;
    }
    .crm-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.88rem;
    }
    .crm-table th, .crm-table td {
      padding: 0.9rem 1rem;
      text-align: left;
      border-bottom: 1px solid var(--border-dark);
      vertical-align: top;
    }
    .crm-table th {
      font-family: var(--font-display);
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--soft-rose);
      background: rgba(255, 255, 255, 0.03);
    }
    .crm-badge {
      display: inline-flex;
      align-items: center;
      padding: 0.25rem 0.65rem;
      border-radius: 999px;
      font-family: var(--font-display);
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      background: rgba(166, 56, 84, 0.22);
      color: var(--soft-rose);
      border: 1px solid rgba(166, 56, 84, 0.45);
    }
    .crm-input, .crm-select, .crm-textarea {
      width: 100%;
      padding: 0.65rem 0.9rem;
      border-radius: 8px;
      border: 1px solid rgba(233, 221, 224, 0.2);
      background: #130F12;
      color: var(--off-white);
      font-size: 0.88rem;
    }
    .crm-input:focus, .crm-select:focus, .crm-textarea:focus {
      outline: none;
      border-color: var(--crimson);
    }
    .crm-modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(6px);
      z-index: 200;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }
    .crm-modal {
      background: #1F191E;
      border: 1px solid var(--crimson);
      border-radius: 16px;
      max-width: 820px;
      width: 100%;
      max-height: 90vh;
      overflow-y: auto;
      padding: 2rem;
    }
    @media (max-width: 920px) {
      .crm-layout {
        grid-template-columns: 1fr;
      }
      .crm-sidebar {
        position: static;
        height: auto;
        border-right: none;
        border-bottom: 1px solid var(--border-dark);
      }
      .crm-main {
        padding: 1.25rem;
      }
    }
  </style>
</head>
<body>
  <div id="nc-crm-root"></div>

  <script src="/js/i18n.js"></script>
  <script src="/js/admin-app.js"></script>
</body>
</html>
