/* ============================================================================
   NOVEN.CODE — BESPOKE DESIGN SYSTEM & EDITORIAL STYLESHEET
   Visual Direction: Editorial Brutalist Luxury + Swiss Precision Grid
   Palette:
     - Deep Burgundy: #681D32
     - Crimson:       #A63854
     - Off White:     #F8F7F5
     - Near Black:    #171316
     - Soft Rose:     #E9DDE0
     - White:         #FFFFFF
   ============================================================================ */

@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@400;500;600;700&family=Space+Grotesk:wght@600;700;800&display=swap');

:root {
  --burgundy: #681D32;
  --burgundy-dark: #4B1323;
  --crimson: #A63854;
  --off-white: #F8F7F5;
  --near-black: #171316;
  --near-black-elevated: #211B1F;
  --soft-rose: #E9DDE0;
  --white: #FFFFFF;

  --border-dark: rgba(233, 221, 224, 0.14);
  --border-light: rgba(23, 19, 22, 0.12);
  --font-display: 'Space Grotesk', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  --font-sans: 'Inter', 'Manrope', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  --transition-smooth: cubic-bezier(0.22, 1, 0.36, 1);
}

*, *::before, *::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html {
  scroll-behavior: smooth;
  font-size: 16px;
  background-color: var(--near-black);
  color: var(--off-white);
  font-family: var(--font-sans);
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  overflow-x: hidden;
}

body {
  min-height: 100vh;
  overflow-x: hidden;
  line-height: 1.6;
  background-color: var(--off-white);
  color: var(--near-black);
}

a {
  color: inherit;
  text-decoration: none;
  transition: color 0.25s var(--transition-smooth), opacity 0.25s var(--transition-smooth);
}

button, input, select, textarea {
  font-family: inherit;
  font-size: inherit;
  color: inherit;
}

button {
  cursor: pointer;
  border: none;
  background: none;
}

img, svg, canvas {
  display: block;
  max-width: 100%;
}

/* ============================================================================
   LAYOUT & CONTAINERS
   ============================================================================ */
.nc-container {
  width: 100%;
  max-width: 1380px;
  margin: 0 auto;
  padding: 0 2rem;
}

@media (max-width: 768px) {
  .nc-container {
    padding: 0 1.25rem;
  }
}

/* Editorial Bracket Tag: [ 01 / CAPABILITIES ] */
.nc-bracket-tag {
  display: inline-flex;
  align-items: center;
  gap: 0.5rem;
  font-family: var(--font-display);
  font-size: 0.78rem;
  font-weight: 700;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--crimson);
}

.nc-section-dark .nc-bracket-tag {
  color: var(--soft-rose);
}

.nc-section-burgundy .nc-bracket-tag {
  color: var(--soft-rose);
}

/* ============================================================================
   NAVIGATION HEADER
   ============================================================================ */
.nc-header {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  z-index: 100;
  background: rgba(23, 19, 22, 0.88);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border-bottom: 1px solid var(--border-dark);
  color: var(--off-white);
  transition: background 0.3s var(--transition-smooth);
}

.nc-header-inner {
  display: flex;
  align-items: center;
  justify-content: space-between;
  height: 78px;
  gap: 1.5rem;
}

.nc-logo {
  display: inline-flex;
  align-items: center;
  gap: 0.65rem;
  font-family: var(--font-display);
  font-weight: 800;
  font-size: 1.25rem;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--white);
}

.nc-logo-mark {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 32px;
  height: 32px;
  border-radius: 6px;
  background: var(--burgundy);
  border: 1px solid var(--crimson);
  color: var(--white);
  font-size: 1.05rem;
  line-height: 1;
}

.nc-nav-links {
  display: flex;
  align-items: center;
  gap: 0.35rem;
}

.nc-nav-item {
  position: relative;
  padding: 0.5rem 0.75rem;
  font-size: 0.85rem;
  font-weight: 500;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  color: rgba(248, 247, 245, 0.76);
  transition: color 0.2s ease;
}

.nc-nav-item:hover,
.nc-nav-item.active {
  color: var(--white);
}

.nc-nav-item.active::after {
  content: '';
  position: absolute;
  bottom: 2px;
  left: 0.75rem;
  right: 0.75rem;
  height: 2px;
  background: var(--crimson);
}

.nc-nav-sep {
  color: rgba(233, 221, 224, 0.22);
  font-size: 0.75rem;
  user-select: none;
}

.nc-header-actions {
  display: flex;
  align-items: center;
  gap: 0.75rem;
}

/* Language Switcher */
.nc-lang-switcher {
  display: inline-flex;
  align-items: center;
  background: rgba(255, 255, 255, 0.06);
  border: 1px solid var(--border-dark);
  border-radius: 999px;
  padding: 0.2rem;
}

.nc-lang-btn {
  padding: 0.3rem 0.65rem;
  border-radius: 999px;
  font-size: 0.75rem;
  font-weight: 700;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: rgba(248, 247, 245, 0.65);
  transition: all 0.2s ease;
}

.nc-lang-btn.active {
  background: var(--burgundy);
  color: var(--white);
  box-shadow: 0 2px 8px rgba(104, 29, 50, 0.45);
}

/* Ambient Sound Control Pill */
.nc-sound-toggle {
  display: inline-flex;
  align-items: center;
  gap: 0.4rem;
  padding: 0.4rem 0.75rem;
  border-radius: 999px;
  border: 1px solid var(--border-dark);
  background: rgba(255, 255, 255, 0.04);
  color: var(--soft-rose);
  font-size: 0.75rem;
  font-weight: 600;
  transition: all 0.2s ease;
}

.nc-sound-toggle:hover {
  border-color: var(--crimson);
  background: rgba(166, 56, 84, 0.18);
}

.nc-sound-bars {
  display: inline-flex;
  align-items: flex-end;
  gap: 2px;
  height: 12px;
}

.nc-sound-bars span {
  display: block;
  width: 2px;
  background: var(--crimson);
  height: 4px;
  transition: height 0.2s ease;
}

.nc-sound-toggle.playing .nc-sound-bars span:nth-child(1) { animation: soundWave 0.8s infinite ease-in-out; }
.nc-sound-toggle.playing .nc-sound-bars span:nth-child(2) { animation: soundWave 0.6s infinite ease-in-out 0.15s; }
.nc-sound-toggle.playing .nc-sound-bars span:nth-child(3) { animation: soundWave 0.9s infinite ease-in-out 0.3s; }

@keyframes soundWave {
  0%, 100% { height: 3px; }
  50% { height: 12px; }
}

/* Buttons */
.nc-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 0.65rem;
  padding: 0.85rem 1.6rem;
  border-radius: 999px;
  font-family: var(--font-display);
  font-size: 0.85rem;
  font-weight: 700;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  transition: all 0.25s var(--transition-smooth);
  white-space: nowrap;
}

.nc-btn-primary {
  background: var(--burgundy);
  color: var(--white);
  border: 1px solid var(--crimson);
}

.nc-btn-primary:hover {
  background: var(--crimson);
  transform: translateY(-2px);
  box-shadow: 0 10px 24px rgba(104, 29, 50, 0.35);
}

.nc-btn-white {
  background: var(--white);
  color: var(--near-black);
  border: 1px solid var(--white);
}

.nc-btn-white:hover {
  background: var(--soft-rose);
  border-color: var(--soft-rose);
  transform: translateY(-2px);
}

.nc-btn-outline-light {
  background: transparent;
  color: var(--white);
  border: 1px solid rgba(233, 221, 224, 0.35);
}

.nc-btn-outline-light:hover {
  border-color: var(--white);
  background: rgba(255, 255, 255, 0.08);
}

.nc-btn-outline-dark {
  background: transparent;
  color: var(--near-black);
  border: 1px solid rgba(23, 19, 22, 0.25);
}

.nc-btn-outline-dark:hover {
  border-color: var(--burgundy);
  color: var(--burgundy);
  background: rgba(104, 29, 50, 0.05);
}

/* Circular Arrow CTA (from Design Reference 5) */
.nc-circle-cta {
  display: inline-flex;
  align-items: center;
  gap: 0.9rem;
  font-family: var(--font-display);
  font-size: 0.88rem;
  font-weight: 700;
  letter-spacing: 0.08em;
  text-transform: uppercase;
}

.nc-circle-cta-icon {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 52px;
  height: 52px;
  border-radius: 50%;
  background: var(--white);
  color: var(--near-black);
  transition: transform 0.3s var(--transition-smooth), background 0.3s ease;
}

.nc-circle-cta:hover .nc-circle-cta-icon {
  transform: scale(1.08) rotate(12deg);
  background: var(--soft-rose);
}

/* Mobile Menu Button */
.nc-mobile-toggle {
  display: none;
  width: 42px;
  height: 42px;
  border-radius: 8px;
  border: 1px solid var(--border-dark);
  align-items: center;
  justify-content: center;
  color: var(--white);
}

@media (max-width: 1080px) {
  .nc-nav-links {
    display: none;
  }
  .nc-mobile-toggle {
    display: inline-flex;
  }
}

.nc-mobile-drawer {
  display: none;
  position: fixed;
  top: 78px;
  left: 0;
  right: 0;
  bottom: 0;
  background: var(--near-black);
  z-index: 99;
  padding: 2rem 1.5rem;
  flex-direction: column;
  justify-content: space-between;
  border-top: 1px solid var(--border-dark);
  overflow-y: auto;
}

.nc-mobile-drawer.open {
  display: flex;
}

.nc-mobile-nav-list {
  display: flex;
  flex-direction: column;
  gap: 0.75rem;
}

.nc-mobile-nav-link {
  font-family: var(--font-display);
  font-size: 1.65rem;
  font-weight: 700;
  padding: 0.65rem 0;
  border-bottom: 1px solid var(--border-dark);
  color: var(--off-white);
  display: flex;
  align-items: center;
  justify-content: space-between;
}

/* ============================================================================
   HERO SECTION (Inspired by References 1, 2 & 5)
   ============================================================================ */
.nc-hero {
  position: relative;
  min-height: 100vh;
  padding-top: 120px;
  padding-bottom: 4.5rem;
  background: radial-gradient(circle at 72% 36%, rgba(166, 56, 84, 0.34) 0%, rgba(104, 29, 50, 0.58) 38%, #171316 82%);
  color: var(--white);
  overflow: hidden;
  display: flex;
  align-items: center;
  border-bottom: 1px solid var(--border-dark);
}

.nc-hero-canvas {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
  z-index: 1;
  opacity: 0.85;
}

/* Architectural pin lines inspired by Reference 1 & 2 */
.nc-hero-grid-overlay {
  position: absolute;
  inset: 0;
  z-index: 2;
  pointer-events: none;
  max-width: 1380px;
  margin: 0 auto;
  border-left: 1px solid rgba(233, 221, 224, 0.08);
  border-right: 1px solid rgba(233, 221, 224, 0.08);
}

.nc-hero-content {
  position: relative;
  z-index: 3;
  width: 100%;
}

.nc-hero-top-meta {
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 1rem;
  margin-bottom: 2.25rem;
  padding-bottom: 1.25rem;
  border-bottom: 1px solid rgba(233, 221, 224, 0.14);
}

.nc-hero-index-counter {
  font-family: var(--font-display);
  font-size: 0.82rem;
  font-weight: 700;
  letter-spacing: 0.14em;
  color: var(--soft-rose);
}

.nc-hero-main-grid {
  display: grid;
  grid-template-columns: 1.35fr 0.65fr;
  gap: 3rem;
  align-items: end;
}

.nc-hero-headline {
  font-family: var(--font-display);
  font-size: clamp(2.85rem, 7.2vw, 6.4rem);
  font-weight: 800;
  line-height: 0.94;
  letter-spacing: -0.035em;
  text-transform: uppercase;
  color: var(--white);
  margin-bottom: 2rem;
}

.nc-hero-headline .accent-line {
  display: block;
  color: var(--soft-rose);
}

.nc-hero-headline .crimson-dot {
  color: var(--crimson);
}

.nc-hero-description-col {
  position: relative;
  padding-left: 1.5rem;
  border-left: 1px solid rgba(233, 221, 224, 0.28);
}

.nc-hero-description-col::before {
  content: '';
  position: absolute;
  top: -4px;
  left: -4px;
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--crimson);
  box-shadow: 0 0 0 4px rgba(166, 56, 84, 0.25);
}

.nc-hero-sub {
  font-size: 1.08rem;
  line-height: 1.65;
  color: rgba(248, 247, 245, 0.86);
  margin-bottom: 2rem;
  max-width: 48ch;
}

.nc-hero-cta-row {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 1rem;
  margin-top: 2rem;
}

/* Hero Bento Accent Cards (Inspired by Reference 1 bottom-right cards) */
.nc-hero-bento-row {
  margin-top: 3.5rem;
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 1.25rem;
}

.nc-bento-card {
  padding: 1.5rem;
  border-radius: 12px;
  border: 1px solid rgba(233, 221, 224, 0.16);
  background: rgba(23, 19, 22, 0.65);
  backdrop-filter: blur(10px);
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  min-height: 148px;
  transition: transform 0.25s var(--transition-smooth), border-color 0.25s ease;
}

.nc-bento-card:hover {
  transform: translateY(-4px);
  border-color: var(--crimson);
}

.nc-bento-card.light-accent {
  background: var(--off-white);
  color: var(--near-black);
  border-color: var(--white);
}

.nc-bento-card.burgundy-accent {
  background: var(--burgundy);
  color: var(--white);
  border-color: var(--crimson);
}

.nc-bento-asterisk {
  font-family: var(--font-display);
  font-size: 1.6rem;
  font-weight: 800;
  line-height: 1;
  color: var(--crimson);
}

.nc-bento-card.burgundy-accent .nc-bento-asterisk {
  color: var(--soft-rose);
}

.nc-bento-title {
  font-family: var(--font-display);
  font-size: 1.15rem;
  font-weight: 700;
  margin-top: 0.75rem;
}

.nc-bento-caption {
  font-size: 0.82rem;
  opacity: 0.78;
  margin-top: 0.35rem;
}

@media (max-width: 960px) {
  .nc-hero-main-grid {
    grid-template-columns: 1fr;
    gap: 2rem;
  }
  .nc-hero-bento-row {
    grid-template-columns: 1fr;
  }
}

/* ============================================================================
   SECTIONS & EDITORIAL HEADERS
   ============================================================================ */
.nc-section {
  padding: 6.5rem 0;
  position: relative;
}

.nc-section-light {
  background-color: var(--off-white);
  color: var(--near-black);
}

.nc-section-white {
  background-color: var(--white);
  color: var(--near-black);
}

.nc-section-dark {
  background-color: var(--near-black);
  color: var(--off-white);
}

.nc-section-burgundy {
  background-color: var(--burgundy);
  color: var(--white);
}

.nc-section-header {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 2rem;
  margin-bottom: 4rem;
  padding-bottom: 1.75rem;
  border-bottom: 1px solid var(--border-light);
}

.nc-section-dark .nc-section-header,
.nc-section-burgundy .nc-section-header {
  border-bottom-color: var(--border-dark);
}

.nc-section-title {
  font-family: var(--font-display);
  font-size: clamp(2.1rem, 4.4vw, 3.6rem);
  font-weight: 800;
  line-height: 1.04;
  letter-spacing: -0.025em;
  text-transform: uppercase;
  margin-top: 0.65rem;
}

.nc-section-subtitle {
  max-width: 48ch;
  font-size: 1rem;
  opacity: 0.78;
  line-height: 1.65;
}

/* ============================================================================
   SERVICES GRID (Inspired by Design Reference 3)
   ============================================================================ */
.nc-services-wrapper {
  position: relative;
}

/* Glowing crimson connecting path behind cards (Reference 3 motif) */
.nc-services-connector-line {
  position: absolute;
  top: 50%;
  left: -2rem;
  right: -2rem;
  height: 6px;
  background: linear-gradient(90deg, transparent 0%, var(--crimson) 20%, var(--soft-rose) 50%, var(--crimson) 80%, transparent 100%);
  opacity: 0.45;
  filter: blur(1px);
  pointer-events: none;
  z-index: 0;
}

.nc-services-grid {
  position: relative;
  z-index: 1;
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 1.5rem;
}

.nc-service-card {
  background: var(--off-white);
  color: var(--near-black);
  border-radius: 16px;
  padding: 2.25rem 1.85rem;
  min-height: 390px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  border: 1px solid rgba(23, 19, 22, 0.08);
  transition: transform 0.3s var(--transition-smooth), box-shadow 0.3s var(--transition-smooth), border-color 0.3s ease;
  position: relative;
  overflow: hidden;
}

.nc-service-card:hover {
  transform: translateY(-6px);
  border-color: var(--crimson);
  box-shadow: 0 20px 40px rgba(0, 0, 0, 0.35);
}

.nc-service-num {
  font-family: var(--font-display);
  font-size: 0.85rem;
  font-weight: 700;
  letter-spacing: 0.14em;
  color: var(--burgundy);
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 1.25rem;
}

.nc-service-title {
  font-family: var(--font-display);
  font-size: 1.45rem;
  font-weight: 700;
  line-height: 1.2;
  letter-spacing: -0.015em;
  color: var(--near-black);
  margin-bottom: 1rem;
}

.nc-service-desc {
  font-size: 0.92rem;
  line-height: 1.6;
  color: rgba(23, 19, 22, 0.75);
  margin-bottom: 1.25rem;
}

.nc-service-benefits {
  list-style: none;
  margin-bottom: 1.5rem;
  border-top: 1px solid rgba(23, 19, 22, 0.1);
  padding-top: 1rem;
}

.nc-service-benefits li {
  font-size: 0.82rem;
  color: rgba(23, 19, 22, 0.82);
  padding: 0.25rem 0;
  display: flex;
  align-items: center;
  gap: 0.5rem;
}

.nc-service-benefits li::before {
  content: '•';
  color: var(--crimson);
  font-weight: 800;
}

.nc-service-cta {
  display: inline-flex;
  align-items: center;
  justify-content: space-between;
  width: 100%;
  padding-top: 0.85rem;
  border-top: 1px solid rgba(23, 19, 22, 0.1);
  font-family: var(--font-display);
  font-size: 0.8rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--burgundy);
}

.nc-service-card:hover .nc-service-cta {
  color: var(--crimson);
}

@media (max-width: 1180px) {
  .nc-services-grid {
    grid-template-columns: repeat(2, 1fr);
  }
}

@media (max-width: 640px) {
  .nc-services-grid {
    grid-template-columns: 1fr;
  }
}

/* ============================================================================
   WORKFLOW GANTT TIMELINE (Inspired by Design Reference 4)
   ============================================================================ */
.nc-workflow-board {
  background: var(--off-white);
  color: var(--near-black);
  border-radius: 18px;
  padding: 2.75rem;
  border: 1px solid rgba(233, 221, 224, 0.25);
  box-shadow: 0 24px 48px rgba(0, 0, 0, 0.28);
}

 process work at Noven.code?","a_ru":"Мы работаем по прозрачному 8-этапному процессу: от первичной заявки, обсуждения задач и проектирования ТЗ до индивидуального UI/UX-дизайна, фронтенд/бэкенд разработки, тестирования, ревью с заказчиком и финального запуска.","a_kk":"Біз ашық 8 кезеңдік процесс бойынша жұмыс істейміз: бастапқы өтінімнен, міндеттерді талқылаудан және ТТ жобалаудан бастап жеке UI/UX-дизайнға, фронтенд/бэкенд әзірлеуге, тестілеуге, тапсырыс берушімен шолуға және финалдық іске қосуға дейін.","a_en":"We follow a structured 8-stage workflow: Initial Request, Project Discussion, Requirements & Planning, UI/UX Design, Full-Stack Development, QA Testing, Client Review, and Final Delivery.","is_visible":1,"sort_order":1},{"id":"faq-02","category":"timelines","q_ru":"От чего зависят сроки реализации проекта?","q_kk":"Жобаны іске асыру мерзімі неге байланысты?","q_en":"What determines project timelines?","a_ru":"Сроки напрямую зависят от выбранного типа проекта, количества уникальных шаблонов страниц, наличия 3D-графики, сложности серверной логики (CRM, личные кабинеты) и оперативности согласования промежуточных этапов.","a_kk":"Мерзімдер таңдалған жоба түріне, бірегей бет үлгілерінің санына, 3D-графиканың болуына, серверлік логиканың күрделілігіне (CRM, жеке кабинеттер) және аралық кезеңдерді келісу жылдамдығына тікелей байланысты.","a_en":"Timelines depend on the project scope, number of custom page layouts, interactive 3D requirements, backend complexity (such as custom CRM modules), and the pace of milestone feedback.","is_visible":1,"sort_order":2},{"id":"faq-03","category":"pricing","q_ru":"Почему стоимость рассчитывается индивидуально?","q_kk":"Неліктен құны жеке есептеледі?","q_en":"Why is pricing tailored to each project?","a_ru":"Каждый бизнес имеет разные задачи: кому-то необходим лаконичный имиджевый сайт (START), а кому-то — многоязычная платформа с собственной CRM и 3D-визуализацией (PREMIUM). Мы формируем точную смету после изучения вашей заявки в конструкторе проекта.","a_kk":"Әр бизнестің міндеттері әртүрлі: біреуге ықшам имидждік сайт (START), ал біреуге жеке CRM және 3D-визуализациясы бар көптілді платформа (PREMIUM) қажет. Біз жоба конструкторындағы өтініміңізді зерделегеннен кейін нақты сметаны қалыптастырамыз.","a_en":"Every business has distinct requirements—ranging from a focused brand website (START) to a trilingual platform with custom CRM and 3D visuals (PREMIUM). We provide an exact quote based on your selected scope.","is_visible":1,"sort_order":3},{"id":"faq-04","category":"references","q_ru":"Зачем загружать дизайн-референсы при оформлении заказа?","q_kk":"Тапсырыс беру кезінде дизайн-референстерді не үшін жүктеу керек?","q_en":"Why can I upload design references in the order builder?","a_ru":"Скриншоты, фотографии и примеры визуальных решений помогают нашей команде точно понять ваши эстетические предпочтения по композиции, типографике, цвету и характеру анимаций еще до старта этапа дизайна.","a_kk":"Скриншоттар, фотосуреттер және визуалды шешімдер үлгілері біздің командаға дизайн кезеңі басталғанға дейін композиция, типографика, түс және анимация сипаты бойынша эстетикалық талғамыңызды дәл түсінуге көмектеседі.","a_en":"Uploading screenshots, photographs, and brand assets helps our creative direction team align closely with your preferred typography, layout density, color relationships, and motion style from day one.","is_visible":1,"sort_order":4},{"id":"faq-05","category":"3d","q_ru":"Не будут ли 3D-элементы замедлять работу сайта на телефонах?","q_kk":"3D-элементтер телефондарда сайттың жұмысын баяулатпай ма?","q_en":"Will 3D elements slow down the website on mobile devices?","a_ru":"Мы используем аппаратно-оптимизированную геометрию, адаптивный DPR, контроль видимости холста и автоматическое упрощение сцен при включенном режиме экономии ресурсов (prefers-reduced-motion).","a_kk":"Біз аппараттық оңтайландырылған геометрияны, бейімделгіш DPR-ді, кенептің көрінуін бақылауды және ресурстарды үнемдеу режимі (prefers-reduced-motion) қосылған кезде сахналарды автоматты жеңілдетуді қолданамыз.","a_en":"We engineer lightweight procedural geometries, adaptive pixel ratios, viewport pause-on-scroll, and full support for prefers-reduced-motion so mobile performance remains fast and responsive.","is_visible":1,"sort_order":5},{"id":"faq-06","category":"crm","q_ru":"Что включает в себя разработка индивидуальной CRM-системы?","q_kk":"Жеке CRM-жүйені әзірлеуге не кіреді?","q_en":"What is included in custom CRM development?","a_ru":"Кастомная CRM создается под ваши реальные процессы: учет заявок и клиентов, ведение проектов и задач, распределение прав доступа по ролям сотрудников, журнал безопасности и мгновенные уведомления в Telegram.","a_kk":"Кастомды CRM сіздің нақты процестеріңізге сай жасалады: өтінімдер мен клиенттерді есепке алу, жобалар мен тапсырмаларды жүргізу, қызметкерлер рөлдері бойынша қолжетімділік құқықтарын бөлу, қауіпсіздік журналы және Telegram-ға жедел хабарламалар.","a_en":"Our custom CRM systems are built around your exact operations: order pipelines, client profiles, project & task tracking, server-enforced role permissions (RBAC), audit logs, and Telegram notifications.","is_visible":1,"sort_order":6},{"id":"faq-07","category":"revisions","q_ru":"Как организованы правки и согласование этапов?","q_kk":"Түзетулер мен кезеңдерді келісу қалай ұйымдастырылған?","q_en":"How are revisions and milestone reviews handled?","a_ru":"Каждый ключевой этап (структура, дизайн-концепция, верстка, функционал) проходит структурированное ревью. В рамках согласованного технического задания предусмотрены итерации правок для точного соответствия целям проекта.","a_kk":"Әрбір негізгі кезең (құрылым, дизайн-концепция, верстка, функционал) құрылымдалған шолудан өтеді. Келісілген техникалық тапсырма аясында жоба мақсаттарына дәл сәйкес келу үшін түзету итерациялары қарастырылған.","a_en":"Each major milestone (wireframes, visual design, frontend, backend) includes structured review rounds defined in the project scope to ensure alignment without scope creep.","is_visible":1,"sort_order":7},{"id":"faq-08","category":"maintenance","q_ru":"Сможем ли мы самостоятельно менять тарифы, услуги и портфолио после сдачи?","q_kk":"Жоба тапсырылғаннан кейін тарифтерді, қызметтерді және портфолионы өзіміз өзгерте аламыз ба?","q_en":"Can we update pricing, services, and portfolio items ourselves after launch?","a_ru":"Да. Платформа оснащена встроенной системой управления контентом и тарифами в панели администратора: все изменения сразу сохраняются в базе данных и отображаются на сайте на трех языках.","a_kk":"Иә. Платформа әкімші панелінде контентті және тарифтерді басқарудың кіріктірілген жүйесімен жабдықталған: барлық өзгерістер дерекқорда бірден сақталады және сайтта үш тілде көрсетіледі.","a_en":"Yes. Authorized team members can edit pricing plans, features, services, portfolio items, and FAQs directly inside the CRM, updating the live website immediately across all three languages.","is_visible":1,"sort_order":8},{"id":"faq-09","category":"payments","q_ru":"Каков порядок оплаты проекта?","q_kk":"Жобаны төлеу тәртібі қандай?","q_en":"How are project payments structured?","a_ru":"Оплата разделяется на прозрачные этапы, привязанные к конкретным результатам: старт и проектирование, утверждение дизайна, завершение разработки и финальное тестирование перед релизом.","a_kk":"Төлем нақты нәтижелерге байланған ашық кезеңдерге бөлінеді: бастау және жобалау, дизайнды бекіту, әзірлеуді аяқтау және релиз алдындағы финалдық тестілеу.","a_en":"Payments are structured around clear, verifiable project milestones: kickoff & architecture, design approval, development completion, and final pre-launch sign-off.","is_visible":1,"sort_order":9},{"id":"faq-10","category":"communication","q_ru":"Как связаться с командой Noven.code для обсуждения проекта?","q_kk":"Жобаны талқылау үшін Noven.code командасымен қалай байланысуға болады?","q_en":"How can we communi   // Pure JS SHA-256 implementation (works even on file:// where crypto.subtle may be restricted)
  function sha256Hex(ascii) {
    function rightRotate(value, amount) {
      return (value >>> amount) | (value << (32 - amount));
    }
    const mathPow = Math.pow;
    const maxWord = mathPow(2, 32);
    const lengthProperty = 'length';
    let i, j;
    let result = '';
    const words = [];
    const utf8 = unescape(encodeURIComponent(ascii));
    const asciiBitLength = utf8[lengthProperty] * 8;
    let hash = sha256Hex.h = sha256Hex.h || [];
    const k = sha256Hex.k = sha256Hex.k || [];
    let primeCounter = k[lengthProperty];
    const isComposite = {};
    for (let candidate = 2; primeCounter < 64; candidate++) {
      if (!isComposite[candidate]) {
        for (i = 0; i < 313; i += candidate) {
          isComposite[i] = candidate;
        }
        hash[primeCounter] = (mathPow(candidate, 0.5) * maxWord) | 0;
        k[primeCounter++] = (mathPow(candidate, 1 / 3) * maxWord) | 0;
      }
    }
    let str = utf8 + '\x80';
    while ((str[lengthProperty] % 64) - 56) str += '\x00';
    for (i = 0; i < str[lengthProperty]; i++) {
      j = str.charCodeAt(i);
      if (j >> 8) return '';
      words[i >> 2] |= j << ((3 - (i % 4)) * 8);
    }
    words[words[lengthProperty]] = (asciiBitLength / maxWord) | 0;
    words[words[lengthProperty]] = asciiBitLength;
    let h = hash.slice(0, 8);
    for (j = 0; j < words[lengthProperty]; ) {
      const w = words.slice(j, (j += 16));
      const oldHash = h.slice(0);
      h = h.slice(0, 8);
      for (i = 0; i < 64; i++) {
        const i2 = i + j;
        const w15 = w[i - 15], w2 = w[i - 2];
        const a = h[0], e = h[4];
        const temp1 =
          h[7] +
          (rightRotate(e, 6) ^ rightRotate(e, 11) ^ rightRotate(e, 25)) +
          ((e & h[5]) ^ (~e & h[6])) +
          k[i] +
          (w[i] =
            i < 16
              ? w[i]
              : (w[i - 16] +
                  (rightRotate(w15, 7) ^ rightRotate(w15, 18) ^ (w15 >>> 3)) +
                  w[i - 7] +
                  (rightRotate(w2, 17) ^ rightRotate(w2, 19) ^ (w2 >>> 10))) |
                0);
        const temp2 =
          (rightRotate(a, 2) ^ rightRotate(a, 13) ^ rightRotate(a, 22)) +
          ((a & h[1]) ^ (a & h[2]) ^ (h[1] & h[2]));
        h = [(temp1 + temp2) | 0].concat(h);
        h[4] = (h[4] + temp1) | 0;
        h.pop();
      }
      for (i = 0; i < 8; i++) {
        h[i] = (h[i] + oldHash[i]) | 0;
      }
    }
    for (i = 0; i < 8; i++) {
      for (j = 3; j + 1; j--) {
        const b = (h[i] >> (j * 8)) & 255;
        result += (b < 16 ? 0 : '') + b.toString(16);
      }
    }
    return result;
  }

  function loadLocalDb() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) {
        const parsed = JSON.parse(raw);
        if (parsed && Array.isArray(parsed.services)) return parsed;
      }
    } catch {}
    const now = new Date().toISOString();
    const initialDb = {
      users: [
        {
          id: 'owner-001',
          username: SEED.ownerUsername,
          full_name: 'Noven.code Studio Owner',
          role: 'OWNER',
          digest: SEED.ownerDigest,
          must_change_password: false,
          is_active: true,
          last_login_at: null,
          created_at: now,
          updated_at: now
        }
      ],
      roles: SEED.roles.map((r) => ({ ...r })),
      services: SEED.services.map((s) => ({
        ...s,
        benefits_ru: s.benefits_ru,
        benefits_kk: s.benefits_kk,
        benefits_en: s.benefits_en,
        is_visible: Boolean(s.is_visible)
      })),
      pricingPlans: SEED.pricingPlans.map((p) => ({
        ...p,
        is_custom_quote: Boolean(p.is_custom_quote),
        is_recommended: Boolean(p.is_recommended),
        is_visible: Boolean(p.is_visible),
        features: (p.features || []).map((f, idx) => ({
          id: 'feat-' + p.id + '-' + idx,

          text_ru: f.ru,
          text_kk: f.kk,
          text_en: f.en,

        }))
      })),

      orders: [],
      clients: [],
      projects: [],

    };
    saveLocalDb(initialDb);
    return initialDb;
  }

  function saveLocalDb(db) {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(db));
    } catch {}
  }

  function getSession() {
    try {
      const raw = sessionStorage.getItem(SESSION_KEY) || localStorage.getItem(SESSION_KEY);
      return raw ? JSON.parse(raw) : null;
    } catch {
      return null;
    }
  }

  function setSession(sess) {
    try {
      if (!sess) {
        sessionStorage.removeItem(SESSION_KEY);
        localStorage.removeItem(SESSION_KEY);
      } else {
        const s = JSON.stringify(sess);
        sessionStorage.setItem(SESSION_KEY, s);
        localStorage.setItem(SESSION_KEY, s);
      }
    } catch {}
  }

  function jsonResponse(status, payload) {
    return new Response(JSON.stringify(payload), {
      status,
      headers: { 'Content-Type': 'application/json' }
    });
  }

  async function dispatchTelegramIfConfigured(db, eventType, title, messageText) {
    const tg = db.settings.telegram_config || {};
    const now = new Date().toISOString();
    const notif = {
      id: 'ntf-' + Date.now() + '-' + Math.random().toString(36).slice(2, 6),
      event_type: eventType,
      title,
      message: messageText,
      telegram_sent: false,
      telegram_status: 'queued_missing_credentials',
      created_at: now
    };

    if (tg.botToken && tg.chatId) {
      try {
        const res = await origFetch('https://api.telegram.org/bot' + encodeURIComponent(tg.botToken) + '/sendMessage', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ chat_id: tg.chatId, text: messageText })
        });
        notif.telegram_sent = res.ok;
        notif.telegram_status = res.ok ? 'delivered' : 'http_' + res.status;
      } catch (e) {
        notif.telegram_status = 'network_error';
      }
    }
    db.notifications.unshift(notif);
    saveLocalDb(db);
    return { sent: notif.telegram_sent, status: notif.telegram_status };
  }

  const origFetch = window.fetch.bind(window);

  async function handleVirtualApi(urlStr, options = {}) {
    const u = new URL(urlStr, 'http://127.0.0.1:3000');
    const pathname = u.pathname;
    const method = (options.method || 'GET').toUpperCase();
    const body = options.body ? JSON.parse(options.body) : {};
    const db = loadLocalDb();
    const now = new Date().toISOString();

    if (pathname === '/api/public/bootstrap' && method === 'GET') {

      const selectedServices = Array.isArray(body.selectedServices) ? body.selectedServices : [];
      if (selectedServices.length === 0) return jsonResponse(400, { error: 'Please select at least one service.' });

        }
      }

      const nextNum = db.orders.length + 1;

      let client = db.clients.find((c) => c.phone === body.customerPhone);

      const attachments = Array.isArray(body.attachments)

      const orderRecord = {

        client_id: client.id,

        business_name: body.businessName,
        business_type: body.businessType,
        custom_business_type: body.customBusinessType || '',
        industry: body.industry || '',
        business_description: body.businessDescription,
        target_audience: body.targetAudience || '',
        project_goals: body.projectGoals,
        existing_website: body.existingWebsite || '',

        reference_notes: body.referenceNotes || '',

        primary_color: body.primaryColor || '#681D32',

        preferred_style: body.preferredStyle || '',
        colors_to_avoid: body.colorsToAvoid || '',
        required_features: Array.isArray(body.requiredFeatures) ? body.requiredFeatures : [],

        customer_name: body.customerName,

        customer_email: body.customerEmail || '',

        status: 'New',

      };

      db.orders.unshift(orderRecord);
      db.activityLogs.unshift({

      saveLocalDb(db);

      const tgText = [

    if (pathname === '/api/auth/login' && method === 'POST') {

      const sess = {

    if (pathname === '/api/auth/change-password' && method === 'POST') {

        return jsonResponse(400, { error: 'New password must be at least 8 characters.' });
      }
      user.digest = sha256Hex(SEED.ownerSalt + ':' + user.username + ':' + String(body.newPassword));
      user.updated_at = now;
      saveLocalDb(db);
      return jsonResponse(200, { ok: true });
    }

    if (pathname.startsWith('/api/admin/')) {
      const sess = getSession();
      if (!sess) return jsonResponse(401, { error: 'Unauthorized' });

      if (pathname === '/api/admin/overview' && method === 'GET') {
        const tg = db.settings.telegram_config || {};
        return jsonResponse(200, {
          stats: {
            totalOrders: db.orders.length,
            newOrders: db.orders.filter((o) => o.status === 'New').length,
            activeProjects: db.projects.filter((p) => !['Completed', 'Cancelled'].includes(p.status)).length,
            completedProjects: db.projects.filter((p) => p.status === 'Completed').length,
            cancelledOrders: db.orders.filter((o) => o.status === 'Cancelled').length,
            totalClients: db.clients.length
          },
          orders: db.orders,
          clients: db.clients,
          projects: db.projects,
          tasks: db.tasks,
          employees: db.users.map((u) => ({
            id: u.id,
            username: u.username,
            full_name: u.full_name,
            role: u.role,
            is_active: u.is_active,
            last_login_at: u.last_login_at,
            created_at: u.created_at
          })),
          roles: db.roles,
          pricingPlans: db.pricingPlans,
          services: db.services,
          portfolio: db.portfolio,
          faqs: db.faqs,
          activityLogs: db.activityLogs,
          notifications: db.notifications,
          settings: {
            ...db.settings,
            telegram_config: {
              contactUsername: '@notnormale',
              chatId: tg.chatId || '',
              hasBotToken: Boolean(tg.botToken),
              enabledEvents: tg.enabledEvents || []
            }
          }
        });
      }

      const ordMatch = pathname.match(/^\/api\/admin\/orders\/([^/]+)$/);
      if (ordMatch && method === 'PATCH') {
        const ord = db.orders.find((o) => o.id === ordMatch[1]);
        if (!ord) return jsonResponse(404, { error: 'Order not found' });
        if (body.status !== undefined) ord.status = body.status;
        if (body.assigned_to !== undefined) ord.assigned_to = body.assigned_to;
        if (body.internal_notes !== undefined) ord.internal_notes = body.internal_notes;
        if (body.estimated_budget !== undefined) ord.estimated_budget = body.estimated_budget;
        if (body.desired_deadline !== undefined) ord.desired_deadline = body.desired_deadline;
        ord.updated_at = now;
        saveLocalDb(db);
        return jsonResponse(200, { ok: true });
      }

      if (ordMatch && method === 'DELETE') {
        db.orders = db.orders.filter((o) => o.id !== ordMatch[1]);
        saveLocalDb(db);
        return jsonResponse(200, { ok: true });
      }

      if (pathname === '/api/admin/clients' && method === 'POST') {
        db.clients.unshift({
          id: 'cli-' + Date.now(),
          name: body.name,
          business_name: body.business_name || '',
          business_type: body.business_type || '',
          industry: body.industry || '',
          phone: body.phone,
          whatsapp: body.whatsapp || '',
          email: body.email || '',
          preferred_contact: body.preferred_contact || 'whatsapp',
          website: body.website || '',
          social_links: body.social_links || '',
          internal_notes: body.internal_notes || '',
          created_at: now,
          updated_at: now
        });
        saveLocalDb(db);
        return jsonResponse(201, { ok: true });
      }

      if (pathname === '/api/admin/projects' && method === 'POST') {
        const pCode = '#PRJ-' + String(db.projects.length + 1).padStart(3, '0');
        db.projects.unshift({
          id: 'prj-' + Date.now(),
          project_code: pCode,
          title: body.title,
          description: body.description || '',
          client_id: body.client_id || null,
          order_id: body.order_id || null,
          status: body.status || 'In Progress',
          progress: Number(body.progress || 10),
          deadline: body.deadline || '',
          assigned_employees: Array.isArray(body.assigned_employees) ? body.assigned_employees : [],
          internal_notes: body.internal_notes || '',
          technical_notes: '',
          design_notes: '',
          created_at: now,
          updated_at: now
        });
        saveLocalDb(db);
        return jsonResponse(201, { ok: true, projectCode: pCode });
      }

      const prjMatch = pathname.match(/^\/api\/admin\/projects\/([^/]+)$/);
      if (prjMatch && method === 'PATCH') {
        const prj = db.projects.find((p) => p.id === prjMatch[1]);
        if (!prj) return jsonResponse(404, { error: 'Project not found' });
        Object.assign(prj, body, { updated_at: now });
        saveLocalDb(db);
        return jsonResponse(200, { ok: true });
      }

      if (pathname === '/api/admin/tasks' && method === 'POST') {
        db.tasks.unshift({
          id: 'tsk-' + Date.now(),
          project_id: body.project_id || null,
          title: body.title,
          description: body.description || '',
          task_type: body.task_type || 'development',
          status: body.status || 'To Do',
          priority: body.priority || 'Medium',
          assigned_to: body.assigned_to || null,
          deadline: body.deadline || '',
          technical_notes: '',
          design_notes: '',
          created_at: now,
          updated_at: now
        });
        saveLocalDb(db);
        return jsonResponse(201, { ok: true });
      }

      const tskMatch = pathname.match(/^\/api\/admin\/tasks\/([^/]+)$/);
      if (tskMatch && method === 'PATCH') {
        const tsk = db.tasks.find((t) => t.id === tskMatch[1]);
        if (!tsk) return jsonResponse(404, { error: 'Task not found' });
        Object.assign(tsk, body, { updated_at: now });
        saveLocalDb(db);
        return jsonResponse(200, { ok: true });
      }

      if (pathname === '/api/admin/employees' && method === 'POST') {
        if (sess.user.role !== 'OWNER') return jsonResponse(403, { error: 'Only OWNER can create employee accounts.' });
        db.users.push({
          id: 'usr-' + Date.now(),
          username: body.username,
          full_name: body.full_name,
          role: body.role,
          digest: sha256Hex(SEED.ownerSalt + ':' + body.username + ':' + body.password),
          is_active: true,
          created_at: now,
          updated_at: now
        });
        saveLocalDb(db);
        return jsonResponse(201, { ok: true });
      }

      const empMatch = pathname.match(/^\/api\/admin\/employees\/([^/]+)$/);
      if (empMatch && method === 'PATCH') {
        const emp = db.users.find((u) => u.id === empMatch[1]);
        if (!emp) return jsonResponse(404, { error: 'Not found' });
        if (body.role) emp.role = body.role;
        if (body.is_active !== undefined) emp.is_active = Boolean(body.is_active);
        saveLocalDb(db);
        return jsonResponse(200, { ok: true });
      }

      if (pathname === '/api/admin/pricing' && method === 'POST') {
        const id = 'plan-' + Date.now();
        db.pricingPlans.push({
          id,
          code: String(body.code || 'CUSTOM').toUpperCase(),
          name_ru: body.name_ru || body.code,
          name_kk: body.name_kk || body.code,
          name_en: body.name_en || body.code,
          desc_ru: body.desc_ru || '',
          desc_kk: body.desc_kk || '',
          desc_en: body.desc_en || '',
          price_label_ru: body.price_label_ru || 'По запросу',
          price_label_kk: body.price_label_kk || 'Сұраныс бойынша',
          price_label_en: body.price_label_en || 'Custom Quote',
          is_custom_quote: true,
          is_recommended: Boolean(body.is_recommended),
          is_visible: true,
          sort_order: Number(body.sort_order || 99),
          cta_ru: 'Выбрать тариф',
          cta_kk: 'Тарифті таңдау',
          cta_en: 'Choose Plan',
          features: (body.features || []).map((f, idx) => ({
            id: 'ft-' + Date.now() + '-' + idx,
            text_ru: f.text_ru || '',
            text_kk: f.text_kk || f.text_ru || '',
            text_en: f.text_en || f.text_ru || '',
            is_included: true
          }))
        });
        saveLocalDb(db);
        return jsonResponse(201, { ok: true, id });
      }

      const planMatch = pathname.match(/^\/api\/admin\/pricing\/([^/]+)$/);
      if (planMatch && method === 'PATCH') {
        const plan = db.pricingPlans.find((p) => p.id === planMatch[1]);
        if (!plan) return jsonResponse(404, { error: 'Not found' });
        Object.assign(plan, body);
        if (Array.isArray(body.features)) {
          plan.features = body.features.map((f, idx) => ({
            id: 'ft-' + Date.now() + '-' + idx,
            text_ru: f.text_ru || '',
            text_kk: f.text_kk || f.text_ru || '',
            text_en: f.text_en || f.text_ru || '',
            is_included: true
          }));
        }
        saveLocalDb(db);
        return jsonResponse(200, { ok: true });
      }

      const srvMatch = pathname.match(/^\/api\/admin\/services\/([^/]+)$/);
      if (srvMatch && method === 'PATCH') {
        const srv = db.services.find((s) => s.id === srvMatch[1]);
        if (srv) Object.assign(srv, body);
        saveLocalDb(db);
        return jsonResponse(200, { ok: true });
      }

      const portMatch = pathname.match(/^\/api\/admin\/portfolio\/([^/]+)$/);
      if (portMatch && method === 'PATCH') {
        const pr = db.portfolio.find((p) => p.id === portMatch[1]);
        if (pr) Object.assign(pr, body);
        saveLocalDb(db);
        return jsonResponse(200, { ok: true });
      }

      const faqMatch = pathname.match(/^\/api\/admin\/faqs\/([^/]+)$/);
      if (faqMatch && method === 'PATCH') {
        const fq = db.faqs.find((f) => f.id === faqMatch[1]);
        if (fq) Object.assign(fq, body);
        saveLocalDb(db);
        return jsonResponse(200, { ok: true });
      }

      if (pathname === '/api/admin/settings' && method === 'PATCH') {
        if (body.homepage_content) db.settings.homepage_content = body.homepage_content;
        if (body.telegram_config) {
          db.settings.telegram_config = {
            ...db.settings.telegram_config,
            botToken: body.telegram_config.botToken || db.settings.telegram_config?.botToken || '',
            chatId: body.telegram_config.chatId ?? db.settings.telegram_config?.chatId ?? ''
          };
        }
        saveLocalDb(db);
        return jsonResponse(200, { ok: true });
      }

      if (pathname === '/api/admin/telegram/test' && method === 'POST') {
        const result = await dispatchTelegramIfConfigured(
          db,
          'critical_event',
          'Telegram Integration Verification',
          'NOVEN.CODE CRM — INTEGRATION CHECK\nTriggered by: ' + sess.user.username
        );
        return jsonResponse(200, { ok: true, result });
      }
    }

    return jsonResponse(404, { error: 'Not found' });
  }

  window.fetch = async function(input, init) {
    const urlStr = typeof input === 'string' ? input : input.url;
    if (urlStr.startsWith('/api/')) {
      if (window.location.protocol === 'file:') {
        return handleVirtualApi(urlStr, init);
      }
      if (backendAvailable === false) {
        return handleVirtualApi(urlStr, init);
      }
      try {
        const res = await origFetch(input, init);
        if (res.status === 404 && !res.headers.get('content-type')?.includes('application/json')) {
          backendAvailable = false;
          return handleVirtualApi(urlStr, init);
        }
        backendAvailable = true;
        return res;
      } catch {
        backendAvailable = false;
        return handleVirtualApi(urlStr, init);
      }
    }
    return origFetch(input, init);
  };

  // Safe History pushState wrapper so standalone file:// doesn't throw SecurityError
  const origPushState = window.history.pushState.bind(window.history);
  window.history.pushState = function(stateObj, title, url) {
    try {
      origPushState(stateObj, title, url);
    } catch {
      window.__ncVirtualPath = url;
    }
  };
})();

  <script>
'use strict';

/**
 * Noven.code — Interactive 3D Geometric Sculpture & Ambient Sound Experience
 * - Respects prefers-reduced-motion
 * - Never autoplays audio without explicit user consent
 */

class NovenAmbientSound {
  constructor() {
    this.ctx = null;
    this.masterGain = null;
    this.isPlaying = false;
    this.volume = Number(localStorage.getItem('nc_sound_volume') || 0.25);
    this.consentDecision = localStorage.getItem('nc_sound_consent'); // 'enabled' | 'muted' | null
    this.oscillators = [];
    this.chordInterval = null;
  }

  initEngine() {
    if (this.ctx) return;
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    if (!AudioCtx) return;

    this.ctx = new AudioCtx();
    this.masterGain = this.ctx.createGain();
    this.masterGain.gain.setValueAtTime(0.001, this.ctx.currentTime);

    // Warm low-pass filter for calm ambient electronic pad
    const filter = this.ctx.createBiquadFilter();
    filter.type = 'lowpass';
    filter.frequency.setValueAtTime(620, this.ctx.currentTime);
    filter.Q.setValueAtTime(1.2, this.ctx.currentTime);

    filter.connect(this.masterGain);
    this.masterGain.connect(this.ctx.destination);

    // Ambient chord frequencies (D minor 9th / F major 7th warm harmonic drone)
    const baseFreqs = [146.83, 220.0, 261.63, 329.63];
    baseFreqs.forEach((freq, idx) => {
      const osc = this.ctx.createOscillator();
      const oscGain = this.ctx.createGain();
      osc.type = idx % 2 === 0 ? 'sine' : 'triangle';
      osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
      osc.detune.setValueAtTime((idx - 1.5) * 4, this.ctx.currentTime);

      oscGain.gain.setValueAtTime(0.18 / baseFreqs.length, this.ctx.currentTime);
      osc.connect(oscGain);
      oscGain.connect(filter);
      osc.start();
      this.oscillators.push({ osc, oscGain });
    });

    // Subtle harmonic evolution every 6 seconds
    const chords = [
      [146.83, 220.0, 261.63, 329.63], // Dm9
      [130.81, 196.0, 246.94, 293.66], // Cmaj9
      [116.54, 174.61, 220.0, 261.63], // Bbmaj7
      [110.0, 164.81, 220.0, 277.18]   // A7sus4
    ];
    let chordIdx = 0;
    this.chordInterval = setInterval(() => {
      if (!this.isPlaying || !this.ctx) return;
      chordIdx = (chordIdx + 1) % chords.length;
      const nextChord = chords[chordIdx];
      const now = this.ctx.currentTime;
      this.oscillators.forEach((item, i) => {
        if (nextChord[i]) {
          item.osc.frequency.exponentialRampToValueAtTime(nextChord[i], now + 4.2);
        }
      });
    }, 6500);
  }

  enable() {
    this.initEngine();
    if (!this.ctx) return;
    if (this.ctx.state === 'suspended') {
      this.ctx.resume();
    }
    this.isPlaying = true;
    localStorage.setItem('nc_sound_consent', 'enabled');
    const now = this.ctx.currentTime;
    this.masterGain.gain.cancelScheduledValues(now);
    this.masterGain.gain.setValueAtTime(Math.max(0.001, this.masterGain.gain.value), now);
    this.masterGain.gain.linearRampToValueAtTime(this.volume, now + 1.2);
  }

  mute() {
    this.isPlaying = false;
    localStorage.setItem('nc_sound_consent', 'muted');
    if (this.ctx && this.masterGain) {
      const now = this.ctx.currentTime;
      this.masterGain.gain.cancelScheduledValues(now);
      this.masterGain.gain.linearRampToValueAtTime(0.0001, now + 0.4);
    }
  }

  toggle() {
    if (this.isPlaying) {
      this.mute();
    } else {
      this.enable();
    }
    return this.isPlaying;
  }

  setVolume(val) {
    this.volume = Math.max(0, Math.min(1, Number(val)));
    localStorage.setItem('nc_sound_volume', String(this.volume));
    if (this.isPlaying && this.ctx && this.masterGain) {
      this.masterGain.gain.setTargetAtTime(this.volume, this.ctx.currentTime, 0.15);
    }
  }
}

/**
 * Interactive 3D Spatial Wireframe & Faceted Polyhedron Renderer
 * Renders an interactive 3D architectural icosahedron/torus-knot lattice on the Hero canvas
 */
function initHero3DCanvas(canvasEl) {
  if (!canvasEl) return;
  const ctx = canvasEl.getContext('2d');
  if (!ctx) return;

  const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  let width = 0;
  let height = 0;
  let dpr = Math.min(window.devicePixelRatio || 1, 2);

  function resize() {
    const rect = canvasEl.parentElement.getBoundingClientRect();
    width = rect.width;
    height = rect.height;
    canvasEl.width = width * dpr;
    canvasEl.height = height * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  resize();
  window.addEventListener('resize', resize);

  // Build 3D Icosahedron + Inner Core vertices & edges
  const t = (1 + Math.sqrt(5)) / 2;
  const rawVerts = [
    [-1,  t,  0], [ 1,  t,  0], [-1, -t,  0], [ 1, -t,  0],
    [ 0, -1,  t], [ 0,  1,  t], [ 0, -1, -t], [ 0,  1, -t],
    [ t,  0, -1], [ t,  0,  1], [-t,  0, -1], [-t,  0,  1]
  ].map(([x, y, z]) => {
    const len = Math.hypot(x, y, z);
    return { x: x / len, y: y / len, z: z / len };
  });

  // Outer ring orbital nodes
  const orbitalNodes = [];
  for (let i = 0; i < 24; i++) {
    const angle = (i / 24) * Math.PI * 2;
    orbitalNodes.push({
      x: Math.cos(angle) * 1.45,
      y: Math.sin(angle) * 0.42,
      z: Math.sin(angle) * 1.45
    });
  }

  // Edges between close vertices
  const edges = [];
  for (let i = 0; i < rawVerts.length; i++) {
    for (let j = i + 1; j < rawVerts.length; j++) {
      const d = Math.hypot(
        rawVerts[i].x - rawVerts[j].x,
        rawVerts[i].y - rawVerts[j].y,
        rawVerts[i].z - rawVerts[j].z
      );
      if (d < 1.2) edges.push([i, j]);
    }
  }

  let rotX = 0.35;
  let rotY = 0.6;
  let targetRotX = 0.35;
  let targetRotY = 0.6;

  window.addEventListener('mousemove', (e) => {
    if (prefersReducedMotion) return;
    const nx = (e.clientX / window.innerWidth) - 0.5;
    const ny = (e.clientY / window.innerHeight) - 0.5;
    targetRotY = nx * 1.1;
    targetRotX = ny * 0.7;
  });

  function project(v, radius, cx, cy) {
    // Rotate Y
    const cosY = Math.cos(rotY);
    const sinY = Math.sin(rotY);
    const x1 = v.x * cosY - v.z * sinY;
    const z1 = v.z * cosY + v.x * sinY;

    // Rotate X
    const cosX = Math.cos(rotX);
    const sinX = Math.sin(rotX);
    const y2 = v.y * cosX - z1 * sinX;
    const z2 = z1 * cosX + v.y * sinX;

    const fov = 3.6;
    const scale = fov / (fov + z2);
    return {
      px: cx + x1 * radius * scale,
      py: cy + y2 * radius * scale,
      z: z2,
      scale
    };
  }

  function renderFrame() {
    ctx.clearRect(0, 0, width, height);

    const cx = width > 900 ? width * 0.72 : width * 0.5;
    const cy = height * 0.44;
    const radius = Math.min(width, height) * 0.27;

    if (!prefersReducedMotion) {
      rotY += 0.0035 + (targetRotY - rotY) * 0.03;
      rotX += 0.0015 + (targetRotX - rotX) * 0.03;
    }

    const projected = rawVerts.map((v) => project(v, radius, cx, cy));
    const projectedOrbit = orbitalNodes.map((v) => project(v, radius, cx, cy));

    // Draw orbital ring
    ctx.beginPath();
    projectedOrbit.forEach((pt, idx) => {
      if (idx === 0) ctx.moveTo(pt.px, pt.py);
      else ctx.lineTo(pt.px, pt.py);
    });
    ctx.closePath();
    ctx.strokeStyle = 'rgba(233, 221, 224, 0.14)';
    ctx.lineWidth = 1;
    ctx.stroke();

    // Draw icosahedron edges with depth-aware opacity
    edges.forEach(([i, j]) => {
      const a = projected[i];
      const b = projected[j];
      const avgZ = (a.z + b.z) * 0.5;
      const alpha = Math.max(0.08, Math.min(0.65, 0.38 - avgZ * 0.22));
      ctx.beginPath();
      ctx.moveTo(a.px, a.py);
      ctx.lineTo(b.px, b.py);
      ctx.strokeStyle = avgZ < 0 ? `rgba(166, 56, 84, ${alpha + 0.15})` : `rgba(233, 221, 224, ${alpha})`;
      ctx.lineWidth = avgZ < 0 ? 1.5 : 1;
      ctx.stroke();
    });

    // Draw vertices
    projected.forEach((pt) => {
      const r = Math.max(2, 3.8 * pt.scale);
      ctx.beginPath();
      ctx.arc(pt.px, pt.py, r, 0, Math.PI * 2);
      ctx.fillStyle = pt.z < 0 ? '#A63854' : 'rgba(248, 247, 245, 0.55)';
      ctx.fill();
    });

    if (!prefersReducedMotion) {
      requestAnimationFrame(renderFrame);
    }
  }

  renderFrame();
}

    bindEvents();

  // ==========================================================================
  // EVENT DELEGATION & FORM BINDINGS
  // ==========================================================================
  function bindEvents() {
    // Navigation links
    document.querySelectorAll('[data-nav]').forEach((el) => {
      el.addEventListener('click', (e) => {
        e.preventDefault();
        const targetPath = el.getAttribute('data-nav');
        navigateTo(targetPath);
      });
    });

    // Language switcher
    document.querySelectorAll('[data-lang]').forEach((btn) => {
      btn.addEventListener('click', () => {
        setLang(btn.getAttribute('data-lang'));
      });
    });

    // Mobile menu toggle
    const mobileBtn = document.getElementById('nc-mobile-menu-btn');
    if (mobileBtn) {
      mobileBtn.addEventListener('click', () => {
        state.mobileMenuOpen = !state.mobileMenuOpen;
        renderApp();
      });
    }

    // Sound toggle & consent
    const soundBtn = document.getElementById('nc-sound-btn');
    if (soundBtn) {
      soundBtn.addEventListener('click', () => {
        state.sound.toggle();
        state.showSoundBanner = false;
        renderApp();
      });
    }

    const consentEnable = document.getElementById('nc-consent-enable');
    if (consentEnable) {
      consentEnable.addEventListener('click', () => {
        state.sound.enable();
        state.showSoundBanner = false;
        renderApp();
      });
    }

    const consentMute = document.getElementById('nc-consent-mute');
    if (consentMute) {
      consentMute.addEventListener('click', () => {
        state.sound.mute();
        state.showSoundBanner = false;
        renderApp();
      });
    }

    // Service CTA -> open Order Builder with preselected service
    document.querySelectorAll('[data-order-service]').forEach((btn) => {
      btn.addEventListener('click', () => {
        const srv = btn.getAttribute('data-order-service');
        navigateTo('/start-project', { preselectService: srv });
      });
    });

    // Choose Plan CTA -> open Order Builder with preselected package
    document.querySelectorAll('[data-choose-plan]').forEach((btn) => {
      btn.addEventListener('click', () => {
        const planCode = btn.getAttribute('data-choose-plan');
        navigateTo('/start-project', { preselectPackage: planCode });
      });
    });

    // FAQ Accordion toggle
    document.querySelectorAll('[data-faq-toggle]').forEach((btn) => {
      btn.addEventListener('click', () => {
        const id = btn.getAttribute('data-faq-toggle');
        if (state.faqOpenIds.has(id)) state.faqOpenIds.delete(id);
        else state.faqOpenIds.add(id);
        renderApp();
      });
    });

    // Order Builder controls
    const clearPlanBtn = document.getElementById('nc-clear-plan-btn');
    if (clearPlanBtn) {
      clearPlanBtn.addEventListener('click', () => {
        state.orderForm.selectedPackage = '';
        persistOrderDraft();
        renderApp();
      });
    }

    document.querySelectorAll('[data-toggle-service]').forEach((btn) => {
      btn.addEventListener('click', () => {
        const srv = btn.getAttribute('data-toggle-service');
        const idx = state.orderForm.selectedServices.indexOf(srv);
        if (idx >= 0) state.orderForm.selectedServices.splice(idx, 1);
        else state.orderForm.selectedServices.push(srv);
        state.orderError = '';
        persistOrderDraft();
        renderApp();
      });
    });

    document.querySelectorAll('[data-toggle-feature]').forEach((btn) => {
      btn.addEventListener('click', () => {
        const feat = btn.getAttribute('data-toggle-feature');
        const idx = state.orderForm.requiredFeatures.indexOf(feat);
        if (idx >= 0) state.orderForm.requiredFeatures.splice(idx, 1);
        else state.orderForm.requiredFeatures.push(feat);
        persistOrderDraft();
        renderApp();
      });
    });

    document.querySelectorAll('[data-field]').forEach((input) => {
      const field = input.getAttribute('data-field');
      input.addEventListener('input', (e) => {
        state.orderForm[field] = e.target.value;
        state.orderError = '';
        persistOrderDraft();
      });
    });

    // File Upload Dropzone in Step 3
    const uploadTrigger = document.getElementById('nc-upload-trigger');
    const fileInput = document.getElementById('nc-file-input');
    if (uploadTrigger && fileInput) {
      uploadTrigger.addEventListener('click', () => fileInput.click());
      uploadTrigger.addEventListener('dragover', (e) => {
        e.preventDefault();
      });
      uploadTrigger.addEventListener('drop', (e) => {
        e.preventDefault();
        if (e.dataTransfer.files) handleFilesSelected(e.dataTransfer.files);
      });
      fileInput.addEventListener('change', (e) => {
        if (e.target.files) handleFilesSelected(e.target.files);
      });
    }

    document.querySelectorAll('[data-remove-att]').forEach((btn) => {
      btn.addEventListener('click', () => {
        const idx = Number(btn.getAttribute('data-remove-att'));
        state.orderForm.attachments.splice(idx, 1);
        persistOrderDraft();
        renderApp();
      });
    });

    document.querySelectorAll('[data-goto-step]').forEach((el) => {
      el.addEventListener('click', () => {
        const target = Number(el.getAttribute('data-goto-step'));
        if (target >= 1 && target <= 8) {
          state.orderStep = target;
          state.orderError = '';
          persistOrderDraft();
          renderApp();
        }
      });
    });

    const prevBtn = document.getElementById('nc-order-prev');
    if (prevBtn) {
      prevBtn.addEventListener('click', () => {
        if (state.orderStep > 1) {
          state.orderStep -= 1;
          state.orderError = '';
          persistOrderDraft();
          renderApp();
        }
      });
    }

    const nextBtn = document.getElementById('nc-order-next');
    if (nextBtn) {
      nextBtn.addEventListener('click', () => {
        const tr = t();
        if (state.orderStep === 1 && state.orderForm.selectedServices.length === 0) {
          state.orderError = tr.order.validation.selectService;
          renderApp();
          return;
        }
        if (state.orderStep === 2) {
          const f = state.orderForm;
          if (!f.businessName.trim() || !f.businessType.trim() || !f.businessDescription.trim() || !f.projectGoals.trim()) {
            state.orderError = tr.order.validation.fillBusiness;
            renderApp();
            return;
          }
        }
        if (state.orderStep === 6) {
          const f = state.orderForm;
          if (!f.customerName.trim() || !f.customerPhone.trim()) {
            state.orderError = tr.order.validation.fillContacts;
            renderApp();
            return;
          }
        }
        state.orderError = '';
        state.orderStep += 1;
        persistOrderDraft();
        renderApp();
      });
    }

    const submitBtn = document.getElementById('nc-order-submit');
    if (submitBtn) {
      submitBtn.addEventListener('click', submitProjectOrder);
    }
  }

  function handleFilesSelected(fileList) {
    const files = Array.from(fileList).slice(0, 10 - state.orderForm.attachments.length);
    files.forEach((file) => {
      if (file.size > 10 * 1024 * 1024) {
        state.orderError = `File ${file.name} exceeds 10MB limit.`;
        renderApp();
        return;
      }
      const reader = new FileReader();
      reader.onload = () => {
        state.orderForm.attachments.push({
          name: file.name,
          type: file.type || 'application/octet-stream',
          size: file.size,
          dataBase64: reader.result
        });
        persistOrderDraft();
        renderApp();
      };
      reader.readAsDataURL(file);
    });
  }

  async function submitProjectOrder() {
    if (state.isSubmittingOrder) return;
    const tr = t();
    const f = state.orderForm;

    if (f.selectedServices.length === 0) {
      state.orderError = tr.order.validation.selectService;
      state.orderStep = 1;
      renderApp();
      return;
    }
    if (!f.businessName.trim() || !f.businessType.trim() || !f.businessDescription.trim() || !f.projectGoals.trim()) {
      state.orderError = tr.order.validation.fillBusiness;
      state.orderStep = 2;
      renderApp();
      return;
    }
    if (!f.customerName.trim() || !f.customerPhone.trim()) {
      state.orderError = tr.order.validation.fillContacts;
      state.orderStep = 6;
      renderApp();
      return;
    }

    state.isSubmittingOrder = true;
    state.orderError = '';
    renderApp();

    try {
      const res = await fetch('/api/public/orders', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          ...f,
          locale: state.lang
        })
      });
      const data = await res.json();
      if (!res.ok || !data.ok) {
        state.isSubmittingOrder = false;
        state.orderError = data.error || 'Failed to submit order. Please check your inputs.';
        renderApp();
        return;
      }

      // Order saved in DB & CRM
      state.isSubmittingOrder = false;
      state.confirmedOrder = data;
      sessionStorage.removeItem('nc_order_draft');
      // Reset idempotencyKey for any subsequent new order
      state.orderForm.idempotencyKey = 'nc_' + Date.now() + '_' + Math.random().toString(36).slice(2, 9);
      state.orderStep = 1;
      navigateTo('/order-confirmation');
    } catch (err) {
      state.isSubmittingOrder = false;
      state.orderError = 'Network error while submitting order. Please try again.';
      renderApp();
    }
  }

  async function bootstrapApp() {
    document.documentElement.lang = state.lang;
    try {
      const res = await fetch('/api/public/bootstrap');
      if (res.ok) {
        state.bootstrap = await res.json();
      }
    } catch {
      // Fallback to empty arrays if offline
    }
    renderApp();
  }

  window.refreshNovenPublicSite = bootstrapApp;
  bootstrapApp();
})();

  function esc(str) {
    if (str === null || str === undefined) return '';
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  function hasPerm(perm) {
    if (!crmState.user) return false;
    const perms = crmState.user.permissions || [];
    return perms.includes('*') || perms.includes(perm);
  }

  function showToast(msg) {
    crmState.toast = msg;

    setTimeout(() => {

  async function apiRequest(url, method = 'GET', bodyObj = null) {
    const headers = { 'Content-Type': 'application/json' };
    if (crmState.csrfToken) {
      headers['X-CSRF-Token'] = crmState.csrfToken;
    }
    const opts = { method, headers, credentials: 'same-origin' };
    if (bodyObj) opts.body = JSON.stringify(bodyObj);
    const res = await fetch(url, opts);
    const data = await res.json().catch(() => ({}));
    if (res.status === 401) {
      crmState.authenticated = false;
      crmState.user = null;
      renderCrm();
      throw new Error(data.error || 'Session expired');
    }
    if (!res.ok) {
      throw new Error(data.error || 'Operation failed');
    }
    return data;
  }

  async function checkSessionAndLoad() {
    crmState.loading = true;

        crmState.authenticated = false;
        crmState.loading = false;
        renderCrm();
        return;
      }
      const meData = await meRes.json();
      crmState.authenticated = true;
      crmState.csrfToken = meData.csrfToken;
      crmState.user = meData.user;
      await refreshOverviewData();
    } catch {
      crmState.authenticated = false;
    } finally {
      crmState.loading = false;
      renderCrm();
